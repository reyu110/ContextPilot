<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Snapshot, carry forward, verify</title>
  <desc id="desc">Snapshot samples selected files and preserves explicit notes. A local handoff stores inventory and an integrity record. Resume checks current metadata and Git state, then you reconfirm tasks. Resume is read-only.</desc>
  <rect width="1200" height="340" rx="22" fill="#101e2a"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <g fill="#162936" stroke="#2b414c"><rect x="28" y="28" width="348" height="246" rx="16"/><rect x="426" y="28" width="348" height="246" rx="16"/><rect x="824" y="28" width="348" height="246" rx="16"/></g>
    <g fill="#73e2c0" font-size="15" font-weight="650" letter-spacing="2"><text x="54" y="65">01 / BEFORE YOU LEAVE</text><text x="452" y="65">02 / ON YOUR MACHINE</text><text x="850" y="65">03 / WHEN YOU RETURN</text></g>
    <g fill="#f2f6f3" font-size="31" font-weight="700" letter-spacing="-.8"><text x="54" y="113">Snapshot.</text><text x="452" y="113">Carry forward.</text><text x="850" y="113">Verify.</text></g>
    <g fill="#b4c6c9" font-size="19"><text x="54" y="155">Sample selected files.</text><text x="54" y="184">Preserve explicit notes.</text><text x="452" y="155">A readable local handoff.</text><text x="452" y="184">Inventory + integrity record.</text><text x="850" y="155">Check metadata and Git.</text><text x="850" y="184">Reconfirm the next task.</text></g>
    <g fill="#73e2c0" font-family="'SFMono-Regular', Consolas, monospace" font-size="16"><text x="54" y="239">/contextpilot snapshot</text><text x="452" y="239">.contextpilot/HANDOFF.md</text><text x="850" y="239">/contextpilot resume</text></g>
    <g stroke="#73e2c0" stroke-width="2" fill="none"><path d="M386 151h30m-7-6 7 6-7 6"/><path d="M784 151h30m-7-6 7 6-7 6"/></g>
    <text x="600" y="312" text-anchor="middle" fill="#8eaaae" font-size="17">Explicit invocation. Read-only resume. No automatic task execution.</text>
  </g>
</svg>
